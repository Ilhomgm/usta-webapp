<!DOCTYPE html><html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:image" content="https://usta.uz/banner.jpg" />
    <meta property="og:title" content="USTA — Умный помощник в мире услуг" />
    <meta property="og:description" content="Найди лучшего мастера по отзывам и геолокации!" />
    <title>USTA WebApp Launch</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: url(https://usta-webapp.vercel.app) no-repeat center center;
            background-size: cover;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .button {
            background-color: #00b894;
            color: white;
            border: none;
            padding: 20px 40px;
            margin-bottom: 40px;
            font-size: 20px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }
        .button:hover {
            transform: scale(1.05);
            background-color: #019170;
        }
    </style>
</head>
<body>
    <a href="https://usta-webapp.vercel.app">
        <button class="button">🚀 Открыть USTA WebApp
        </button>
    </a>
</body>
</html>
